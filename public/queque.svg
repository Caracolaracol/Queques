<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Queque</title>
  <!-- queque de molde (ring pound cake) with manjar -->
  <!-- body -->
  <rect x="13" y="28" width="38" height="17" rx="4" fill="#DE7F26"/>
  <!-- fluted ridges -->
  <path d="M22 30.5 V 43" stroke="#C96B1B" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <path d="M32 30 V 43.5" stroke="#C96B1B" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <path d="M42 30.5 V 43" stroke="#C96B1B" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <!-- manjar running over the front rim -->
  <path d="M38.4 33.8 c 2.4 1 3 3.8 1 5.6 c -2 -1 -2.6 -3.6 -1 -5.6 z" fill="#C68B59"/>
  <!-- top surface -->
  <ellipse cx="32" cy="28" rx="19" ry="7" fill="#E8933F"/>
  <!-- top highlight -->
  <path d="M20 25.5 C 24 22.5, 30 21.8, 35 22.2" stroke="#F0A45C" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- center hole -->
  <ellipse cx="32" cy="28" rx="6.5" ry="2.6" fill="#B85E14"/>
  <!-- manjar pooled in the hole -->
  <ellipse cx="32" cy="28.3" rx="4.9" ry="1.9" fill="#C68B59"/>
</svg>
