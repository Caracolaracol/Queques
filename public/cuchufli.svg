<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Cuchuflí</title>
  <!-- rolled wafer tube (cuchuflí), tilted -->
  <g transform="rotate(-18 32 32)">
    <!-- body -->
    <rect x="11" y="21" width="43" height="22" rx="9" fill="#DE7F26"/>
    <!-- lighter top highlight -->
    <path d="M18 25 C 28 21.5, 42 21.5, 50 25.5" stroke="#F0A45C" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- wafer ridges -->
    <path d="M22 24.5 V 39.5" stroke="#C96B1B" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
    <path d="M30 23.8 V 40.2" stroke="#C96B1B" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
    <path d="M38 23.8 V 40.2" stroke="#C96B1B" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
    <path d="M46 24.5 V 39.5" stroke="#C96B1B" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
    <!-- open end -->
    <ellipse cx="12.5" cy="32" rx="6.5" ry="11" fill="#B85E14"/>
    <!-- rolled spiral cross-section -->
    <ellipse cx="12.5" cy="32" rx="4" ry="6.8" fill="none" stroke="#FFF5C8" stroke-width="2.2"/>
    <ellipse cx="12.5" cy="32" rx="1.5" ry="2.5" fill="#FFF5C8"/>
    <!-- powdered sugar -->
    <circle cx="27" cy="28" r="1.4" fill="#FFF5C8" opacity="0.8"/>
    <circle cx="36" cy="35.5" r="1.2" fill="#FFF5C8" opacity="0.8"/>
    <circle cx="43.5" cy="29" r="1.3" fill="#FFF5C8" opacity="0.8"/>
  </g>
</svg>
